<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solana Wallet Investigator</title><style>body{background:#0b1220;color:#eaf0ff;font:16px system-ui;margin:0;padding:20px}main{max-width:750px;margin:auto}.card{background:#17233b;border:1px solid #35435e;border-radius:14px;padding:18px;margin:15px 0}input,button{font:inherit;box-sizing:border-box;width:100%;padding:13px;border-radius:9px;margin:8px 0;background:#253451;color:white;border:1px solid #607092}button{background:#4777e5;font-weight:bold}a{color:#9ec4ff}small{color:#b8c8e0}table{width:100%;font-size:12px;text-align:left}td{padding:8px 2px;border-bottom:1px solid #34425a}.scroll{overflow-x:auto}h1{font-size:25px}</style><main><h1>🔎 Solana Wallet Investigator</h1><p>Version 2: multi-wallet history and shared SOL sender analysis. HELL preloaded.</p><div class="card"><label>Helius API key (never saved)</label><input id="key" type="password" autocomplete="off" placeholder="Enter Helius key"><small>Requests go directly from your browser to Helius. Do not share your key.</small><p>Token mint</p><input id="mint" value="A75Xx6SeftAmWduv9KGwb2GCjXUAhxozcCUCys9jpump"><button id="go">Investigate</button></div><div id="results"></div><script>
const el=id=>document.getElementById(id),res=el('results');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const short=s=>s.slice(0,6)+'…'+s.slice(-6);const wait=ms=>new Promise(r=>setTimeout(r,ms));function card(title,body){res.insertAdjacentHTML('beforeend','<section class="card"><h2>'+esc(title)+'</h2>'+body+'</section>')}async function rpc(k,method,params){let r=await fetch('https://mainnet.helius-rpc.com/?api-key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});if(!r.ok)throw Error(method+' HTTP '+r.status);let j=await r.json();if(j.error)throw Error(j.error.message);return j.result}async function history(k,owner){let r=await fetch('https://api.helius.xyz/v0/addresses/'+owner+'/transactions?api-key='+encodeURIComponent(k)+'&limit=100');if(!r.ok)throw Error('History HTTP '+r.status);return r.json()}const mintDefault='A75Xx6SeftAmWduv9KGwb2GCjXUAhxozcCUCys9jpump';
el('go').onclick=async()=>{const k=el('key').value.trim(),mint=el('mint').value.trim();res.innerHTML='';if(!k||!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(mint)){card('Missing details','Enter the API key and valid token mint.');return}el('go').disabled=true;card('Loading','Fetching token holders and checking wallet histories. This may take a minute.');try{const supply=(await rpc(k,'getTokenSupply',[mint])).value;const ac=(await rpc(k,'getTokenLargestAccounts',[mint])).value.slice(0,20);const infos=await rpc(k,'getMultipleAccounts',[ac.map(x=>x.address),{encoding:'jsonParsed'}]);const rows=ac.map((a,i)=>({account:a.address,owner:infos.value[i]?.data?.parsed?.info?.owner||'Unknown',amount:Number(a.amount)/10**supply.decimals,percent:100*Number(a.amount)/Number(supply.amount)}));const pool='EwsYHiuznyNqH5f65YpfsoQBLq2KyETuvhm5un7wsfDG';const owners=[...new Set(rows.filter(x=>x.owner!=='Unknown'&&x.owner!==pool).map(x=>x.owner))].slice(0,9);const findings=[];for(let i=0;i<owners.length;i++){res.innerHTML='<section class="card">Investigating wallet '+(i+1)+' of '+owners.length+'…</section>';try{const tx=await history(k,owners[i]);const relevant=tx.filter(t=>(t.tokenTransfers||[]).some(x=>x.mint===mint));const solIncoming=tx.flatMap(t=>(t.nativeTransfers||[]).filter(n=>n.toUserAccount===owners[i]&&n.fromUserAccount!==owners[i]).map(n=>({from:n.fromUserAccount,amount:n.amount/1e9,signature:t.signature,time:t.timestamp})));findings.push({owner:owners[i],checked:tx.length,hellTransactions:relevant.map(t=>({signature:t.signature,timestamp:t.timestamp,type:t.type,tokenTransfers:t.tokenTransfers.filter(x=>x.mint===mint)})),solIncoming:solIncoming.slice(0,30),error:null})}catch(e){findings.push({owner:owners[i],error:e.message,checked:0,hellTransactions:[],solIncoming:[]})}await wait(130)}
const sources=new Map();for(const f of findings)for(const t of f.solIncoming)if(t.from){const a=sources.get(t.from)||new Set();a.add(f.owner);sources.set(t.from,a)}const shared=[...sources].filter(([s,owners])=>owners.size>1).map(([source,owners])=>({source,owners:[...owners]}));res.innerHTML='';card('Token overview','<p>Supply: '+Number(supply.uiAmountString).toLocaleString()+'</p><p>Analysed '+findings.length+' non-pool wallet histories (up to 100 recent transactions each).</p><small>Historical analysis is limited to the returned transactions; absence of evidence is not evidence of no connection.</small>');card('Top 20 token accounts','<div class="scroll"><table><tr><th>#</th><th>Owner</th><th>Balance</th><th>%</th></tr>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td><a target="_blank" href="https://solscan.io/account/'+esc(r.owner)+'">'+esc(short(r.owner))+'</a>'+(r.owner===pool?' (known pool)':'')+'</td><td>'+Math.round(r.amount).toLocaleString()+'</td><td>'+r.percent.toFixed(2)+'</td></tr>').join('')+'</table></div>');card('Shared SOL senders',shared.length?shared.map(s=>'<p><a target="_blank" href="https://solscan.io/account/'+esc(s.source)+'">'+esc(short(s.source))+'</a> → '+s.owners.map(short).map(esc).join(', ')+'</p>').join('')+'<small>Shared transfers alone do not prove common ownership. Exchange and service wallets can fund unrelated users.</small>':'<p>No shared SOL senders identified within the sampled histories. This does not rule out connections.</p>');card('Wallet history findings','<div class="scroll"><table><tr><th>Wallet</th><th>Tx sampled</th><th>HELL tx</th><th>Incoming SOL</th></tr>'+findings.map(f=>'<tr><td><a href="https://solscan.io/account/'+esc(f.owner)+'" target="_blank">'+esc(short(f.owner))+'</a></td><td>'+f.checked+'</td><td>'+f.hellTransactions.length+'</td><td>'+f.solIncoming.length+'</td></tr>').join('')+'</table></div>'+findings.filter(f=>f.error).map(f=>'<p>'+esc(short(f.owner))+': '+esc(f.error)+'</p>').join(''));const report={mint,checkedAt:new Date().toISOString(),supply:supply.uiAmountString,accounts:rows,findings,sharedSolSenders:shared,limitations:'Only 100 recent transactions per wallet; shared senders do not establish common ownership; pool exclusion is specific to known HELL pool.'};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});card('Export full evidence','<a id="reportDownload" download="hell-investigation.json">Download JSON investigation report</a><p><small>Contains transaction signatures and wallet addresses, never the API key.</small></p>');el('reportDownload').href=URL.createObjectURL(blob)}catch(e){res.innerHTML='';card('Investigation error',esc(e.message))}finally{el('go').disabled=false}};
</script></main></html>
