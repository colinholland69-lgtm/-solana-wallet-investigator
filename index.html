<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solana Wallet Investigator</title><style>body{background:#0b1220;color:#eaf0ff;font:16px system-ui;margin:0;padding:20px}main{max-width:750px;margin:auto}.card{background:#17233b;border:1px solid #35435e;border-radius:14px;padding:18px;margin:15px 0}input,button{font:inherit;box-sizing:border-box;width:100%;padding:13px;border-radius:9px;margin:8px 0;background:#253451;color:white;border:1px solid #607092}button{background:#4777e5;font-weight:bold}a{color:#9ec4ff}small{color:#b8c8e0}table{width:100%;font-size:12px;text-align:left}td{padding:8px 2px;border-bottom:1px solid #34425a}.scroll{overflow-x:auto}h1{font-size:25px}</style><main><h1>🔎 Solana Wallet Investigator</h1><p>Version 5: creator transaction and signer trace. HELL preloaded.</p><div class="card"><label>Helius API key (never saved)</label><input id="key" type="password" autocomplete="off" placeholder="Enter Helius key"><small>Requests go directly from your browser to Helius. Do not share your key.</small><p>Token mint</p><input id="mint" value="A75Xx6SeftAmWduv9KGwb2GCjXUAhxozcCUCys9jpump"><button id="go">Investigate</button></div><div id="results"></div><script>
const el=id=>document.getElementById(id),res=el('results');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const short=s=>s.slice(0,6)+'…'+s.slice(-6);const wait=ms=>new Promise(r=>setTimeout(r,ms));function card(title,body){res.insertAdjacentHTML('beforeend','<section class="card"><h2>'+esc(title)+'</h2>'+body+'</section>')}async function rpc(k,method,params){let r=await fetch('https://mainnet.helius-rpc.com/?api-key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});if(!r.ok)throw Error(method+' HTTP '+r.status);let j=await r.json();if(j.error)throw Error(j.error.message);return j.result}async function history(k,owner){let r=await fetch('https://api.helius.xyz/v0/addresses/'+owner+'/transactions?api-key='+encodeURIComponent(k)+'&limit=100');if(!r.ok)throw Error('History HTTP '+r.status);return r.json()}const mintDefault='A75Xx6SeftAmWduv9KGwb2GCjXUAhxozcCUCys9jpump';
el('go').onclick=async()=>{const k=el('key').value.trim(),mint=el('mint').value.trim();res.innerHTML='';if(!k||!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(mint)){card('Missing details','Enter the API key and valid token mint.');return}el('go').disabled=true;card('Loading','Fetching token holders and checking wallet histories. This may take a minute.');try{const supply=(await rpc(k,'getTokenSupply',[mint])).value;const ac=(await rpc(k,'getTokenLargestAccounts',[mint])).value.slice(0,20);const infos=await rpc(k,'getMultipleAccounts',[ac.map(x=>x.address),{encoding:'jsonParsed'}]);const rows=ac.map((a,i)=>({account:a.address,owner:infos.value[i]?.data?.parsed?.info?.owner||'Unknown',amount:Number(a.amount)/10**supply.decimals,percent:100*Number(a.amount)/Number(supply.amount)}));const pool='EwsYHiuznyNqH5f65YpfsoQBLq2KyETuvhm5un7wsfDG';const owners=[...new Set(rows.filter(x=>x.owner!=='Unknown'&&x.owner!==pool).map(x=>x.owner))].slice(0,9);const findings=[];for(let i=0;i<owners.length;i++){res.innerHTML='<section class="card">Investigating wallet '+(i+1)+' of '+owners.length+'…</section>';try{const tx=await history(k,owners[i]);const relevant=tx.filter(t=>(t.tokenTransfers||[]).some(x=>x.mint===mint));const solIncoming=tx.flatMap(t=>(t.nativeTransfers||[]).filter(n=>n.toUserAccount===owners[i]&&n.fromUserAccount!==owners[i]).map(n=>({from:n.fromUserAccount,amount:n.amount/1e9,signature:t.signature,time:t.timestamp})));findings.push({owner:owners[i],checked:tx.length,hellTransactions:relevant.map(t=>({signature:t.signature,timestamp:t.timestamp,type:t.type,tokenTransfers:t.tokenTransfers.filter(x=>x.mint===mint)})),solIncoming:solIncoming.slice(0,30),error:null})}catch(e){findings.push({owner:owners[i],error:e.message,checked:0,hellTransactions:[],solIncoming:[]})}await wait(130)}
const sources=new Map();for(const f of findings)for(const t of f.solIncoming)if(t.from){const a=sources.get(t.from)||new Set();a.add(f.owner);sources.set(t.from,a)}const shared=[...sources].filter(([s,owners])=>owners.size>1).map(([source,owners])=>({source,owners:[...owners]}));const targetSet=new Set(owners);const direct=[];for(const f of findings)for(const t of f.hellTransactions)for(const x of t.tokenTransfers){const from=x.fromUserAccount||x.fromTokenAccount||'';const to=x.toUserAccount||x.toTokenAccount||'';if(targetSet.has(from)&&targetSet.has(to)&&from!==to)direct.push({from,to,signature:t.signature,amount:x.tokenAmount,time:t.timestamp})}
const links=[];for(const s of shared)for(let i=0;i<s.owners.length;i++)for(let j=i+1;j<s.owners.length;j++)links.push({a:s.owners[i],b:s.owners[j],reason:'Shared SOL sender',evidence:s.source});
for(const d of direct)links.push({a:d.from,b:d.to,reason:'Direct HELL transfer',evidence:d.signature});
const parent=new Map(owners.map(x=>[x,x]));function root(x){while(parent.get(x)!==x)x=parent.get(x);return x}function union(a,b){if(parent.has(a)&&parent.has(b))parent.set(root(a),root(b))}
for(const l of links)union(l.a,l.b);
const groups=new Map();for(const owner of owners){const r=root(owner);if(!groups.has(r))groups.set(r,[]);groups.get(r).push(owner)}
const clusters=[...groups.values()].filter(g=>g.length>1).map(members=>({members,percentage:rows.filter(r=>members.includes(r.owner)).reduce((a,r)=>a+r.percent,0),evidence:links.filter(l=>members.includes(l.a)&&members.includes(l.b))})).sort((a,b)=>b.percentage-a.percentage);
const counterparty='H5cerWSCncHcwjFU6UQyWPGqBDCa9Dzh27NKVWiQPAxr';let counterpartyTrace={address:counterparty,error:null,checked:0,transactions:[],hellTransfers:[],connections:[],solIncoming:[]};
try{const ct=await history(k,counterparty);counterpartyTrace.checked=ct.length;counterpartyTrace.transactions=ct.map(t=>({signature:t.signature,timestamp:t.timestamp,type:t.type,source:t.source}));counterpartyTrace.hellTransfers=ct.flatMap(t=>(t.tokenTransfers||[]).filter(x=>x.mint===mint).map(x=>({signature:t.signature,timestamp:t.timestamp,type:t.type,from:x.fromUserAccount,to:x.toUserAccount,amount:x.tokenAmount})));counterpartyTrace.solIncoming=ct.flatMap(t=>(t.nativeTransfers||[]).filter(x=>x.toUserAccount===counterparty&&x.fromUserAccount!==counterparty).map(x=>({from:x.fromUserAccount,amount:x.amount/1e9,signature:t.signature,timestamp:t.timestamp})));const cs=new Map();for(const x of counterpartyTrace.hellTransfers){const other=x.from===counterparty?x.to:x.to===counterparty?x.from:null;if(!other||other===pool)continue;const old=cs.get(other)||{wallet:other,count:0,in:0,out:0,signatures:[]};old.count++;if(x.to===counterparty)old.in+=Number(x.amount||0);if(x.from===counterparty)old.out+=Number(x.amount||0);old.signatures.push(x.signature);cs.set(other,old)}counterpartyTrace.connections=[...cs.values()].sort((a,b)=>b.count-a.count)}catch(e){counterpartyTrace.error=e.message}
let creatorTrace={mint,earliestSignature:null,feePayer:null,signers:[],blockTime:null,scanned:0,complete:false,error:null};
try{let before,oldest=null;for(let page=0;page<20;page++){const opts={limit:1000};if(before)opts.before=before;const sigs=await rpc(k,'getSignaturesForAddress',[mint,opts]);if(!sigs.length){creatorTrace.complete=true;break}creatorTrace.scanned+=sigs.length;oldest=sigs[sigs.length-1];if(sigs.length<1000){creatorTrace.complete=true;break}before=oldest.signature;await wait(80)}
if(oldest){creatorTrace.earliestSignature=oldest.signature;creatorTrace.blockTime=oldest.blockTime;const t=await rpc(k,'getTransaction',[oldest.signature,{encoding:'jsonParsed',maxSupportedTransactionVersion:0}]);const keys=t?.transaction?.message?.accountKeys||[];creatorTrace.feePayer=keys[0]?.pubkey||null;creatorTrace.signers=keys.filter(x=>x.signer).map(x=>x.pubkey);creatorTrace.transaction=t?.transaction?.message?.instructions?.map(x=>({program:x.program,programId:x.programId,parsed:x.parsed?.type||null}))||[]}}
catch(e){creatorTrace.error=e.message}
res.innerHTML='';card('Token overview','<p>Supply: '+Number(supply.uiAmountString).toLocaleString()+'</p><p>Analysed '+findings.length+' non-pool wallet histories (up to 100 recent transactions each).</p><small>Historical analysis is limited to the returned transactions; absence of evidence is not evidence of no connection.</small>');card('Top 20 token accounts','<div class="scroll"><table><tr><th>#</th><th>Owner</th><th>Balance</th><th>%</th></tr>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td><a target="_blank" href="https://solscan.io/account/'+esc(r.owner)+'">'+esc(short(r.owner))+'</a>'+(r.owner===pool?' (known pool)':'')+'</td><td>'+Math.round(r.amount).toLocaleString()+'</td><td>'+r.percent.toFixed(2)+'</td></tr>').join('')+'</table></div>');card('Shared SOL senders',shared.length?shared.map(s=>'<p><a target="_blank" href="https://solscan.io/account/'+esc(s.source)+'">'+esc(short(s.source))+'</a> → '+s.owners.map(short).map(esc).join(', ')+'</p>').join('')+'<small>Shared transfers alone do not prove common ownership. Exchange and service wallets can fund unrelated users.</small>':'<p>No shared SOL senders identified within the sampled histories. This does not rule out connections.</p>');card('Potential wallet clusters',clusters.length?clusters.map((c,i)=>'<h3>Evidence cluster '+(i+1)+': '+c.members.length+' wallets · '+c.percentage.toFixed(2)+'% supply</h3><p>'+c.members.map(x=>'<a target="_blank" href="https://solscan.io/account/'+esc(x)+'">'+esc(short(x))+'</a>').join(', ')+'</p><p>'+c.evidence.slice(0,12).map(e=>esc(e.reason)+': '+(e.reason==='Direct HELL transfer'?'<a target="_blank" href="https://solscan.io/tx/'+esc(e.evidence)+'">Transaction</a>':'<a target="_blank" href="https://solscan.io/account/'+esc(e.evidence)+'">Funding address</a>')).join('<br>')+'</p>').join('')+'<small>These are transaction-linked groups, not verified common owners. Shared exchange or service senders can create false links.</small>':'<p>No evidence-linked clusters in the sampled transactions. This does not rule out coordinated wallets.</p>');card('H5cer counterparty investigation',counterpartyTrace.error?'<p>Unavailable: '+esc(counterpartyTrace.error)+'</p>':'<p>'+counterpartyTrace.checked+' recent transactions sampled, '+counterpartyTrace.hellTransfers.length+' HELL transfer entries, '+counterpartyTrace.solIncoming.length+' incoming SOL entries.</p><div class="scroll"><table><tr><th>Counterparty</th><th>Transfers</th><th>To H5cer</th><th>From H5cer</th></tr>'+counterpartyTrace.connections.slice(0,25).map(x=>'<tr><td><a href="https://solscan.io/account/'+esc(x.wallet)+'" target="_blank">'+esc(short(x.wallet))+'</a></td><td>'+x.count+'</td><td>'+Math.round(x.in).toLocaleString()+'</td><td>'+Math.round(x.out).toLocaleString()+'</td></tr>').join('')+'</table></div><small>Trading venues, routers and pool accounts can appear as counterparties. Gross movements are not unique token supply. Full history is not guaranteed.</small>');card('Earliest mint transaction / possible creator',creatorTrace.earliestSignature?'<p>Earliest sampled signature: <a target="_blank" href="https://solscan.io/tx/'+esc(creatorTrace.earliestSignature)+'">'+esc(short(creatorTrace.earliestSignature))+'</a></p><p>Fee payer: '+(creatorTrace.feePayer?'<a target="_blank" href="https://solscan.io/account/'+esc(creatorTrace.feePayer)+'">'+esc(creatorTrace.feePayer)+'</a>':'Unavailable')+'</p><p>Signers: '+creatorTrace.signers.map(x=>'<a target="_blank" href="https://solscan.io/account/'+esc(x)+'">'+esc(short(x))+'</a>').join(', ')+'</p><p>Signatures scanned: '+creatorTrace.scanned+' · Exhaustive: '+(creatorTrace.complete?'Yes':'No')+'</p><small>Earliest mint-address transaction is a creator candidate, not automatically proof of developer ownership. Check parsed launch instructions and funding.</small>':'<p>No creation transaction retrieved. '+esc(creatorTrace.error||'')+'</p>');card('Wallet history findings','<div class="scroll"><table><tr><th>Wallet</th><th>Tx sampled</th><th>HELL tx</th><th>Incoming SOL</th></tr>'+findings.map(f=>'<tr><td><a href="https://solscan.io/account/'+esc(f.owner)+'" target="_blank">'+esc(short(f.owner))+'</a></td><td>'+f.checked+'</td><td>'+f.hellTransactions.length+'</td><td>'+f.solIncoming.length+'</td></tr>').join('')+'</table></div>'+findings.filter(f=>f.error).map(f=>'<p>'+esc(short(f.owner))+': '+esc(f.error)+'</p>').join(''));const report={mint,checkedAt:new Date().toISOString(),supply:supply.uiAmountString,accounts:rows,findings,sharedSolSenders:shared,directHellTransfers:direct,clusters,counterpartyTrace,creatorTrace,limitations:'Only 100 recent transactions per wallet and counterparty, not full wallet history. Cluster edges reflect shared SOL senders or HELL transfers and do not prove common control. Exchange/service addresses can create false links. Pool exclusion is specific to known HELL pool.'};const blob=new Blob([JSON.stringify(report,null,2)],{type:'application/json'});card('Export full evidence','<a id="reportDownload" download="hell-investigation.json">Download JSON investigation report</a><p><small>Contains transaction signatures and wallet addresses, never the API key.</small></p>');el('reportDownload').href=URL.createObjectURL(blob)}catch(e){res.innerHTML='';card('Investigation error',esc(e.message))}finally{el('go').disabled=false}};
</script></main></html>
