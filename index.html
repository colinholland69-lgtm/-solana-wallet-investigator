<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solana Wallet Investigator</title><style>body{background:#0b1220;color:#eaf0ff;font:16px system-ui;margin:0;padding:20px}main{max-width:750px;margin:auto}.card{background:#17233b;border:1px solid #35435e;border-radius:14px;padding:18px;margin:15px 0}input,button{font:inherit;box-sizing:border-box;width:100%;padding:13px;border-radius:9px;margin:8px 0;background:#253451;color:white;border:1px solid #607092}button{background:#4777e5;font-weight:bold}a{color:#9ec4ff}small{color:#b8c8e0}table{width:100%;font-size:12px;text-align:left}td{padding:8px 2px;border-bottom:1px solid #34425a}.scroll{overflow-x:auto}h1{font-size:25px}</style><main><h1>🔎 Solana Wallet Investigator</h1><p>Free, on-demand investigation. HELL is preloaded.</p><div class="card"><label>Helius API key (never saved)</label><input id="key" type="password" autocomplete="off" placeholder="Enter Helius key"><small>Requests go directly from your browser to Helius. Do not share your key.</small><p>Token mint</p><input id="mint" value="A75Xx6SeftAmWduv9KGwb2GCjXUAhxozcCUCys9jpump"><button id="go">Investigate</button></div><div id="results"></div><script>
const el=id=>document.getElementById(id),res=el('results');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const short=s=>s.slice(0,6)+'…'+s.slice(-6);function card(title,body){res.insertAdjacentHTML('beforeend','<section class="card"><h2>'+esc(title)+'</h2>'+body+'</section>')}async function rpc(k,method,params){const r=await fetch('https://mainnet.helius-rpc.com/?api-key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(j.error.message);return j.result}
el('go').onclick=async()=>{const k=el('key').value.trim(),mint=el('mint').value.trim();res.innerHTML='';if(!k||!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(mint)){card('Missing details','Enter your API key and valid Solana mint.');return}el('go').disabled=true;card('Loading','Retrieving largest token accounts…');try{const supply=(await rpc(k,'getTokenSupply',[mint])).value;const ac=(await rpc(k,'getTokenLargestAccounts',[mint])).value.slice(0,20);const rows=[];for(const a of ac){const i=await rpc(k,'getAccountInfo',[a.address,{encoding:'jsonParsed'}]);rows.push({account:a.address,owner:i?.value?.data?.parsed?.info?.owner||'Unknown',amount:Number(a.amount)/10**supply.decimals,percent:100*Number(a.amount)/Number(supply.amount)})}res.innerHTML='';card('Token overview','<p>Supply: '+Number(supply.uiAmountString).toLocaleString()+'</p><a href="https://solscan.io/token/'+mint+'" target="_blank">Open Solscan</a>');card('Largest 20 token accounts','<div class="scroll"><table><tr><th>#</th><th>Owner</th><th>Balance</th><th>%</th></tr>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td><a target="_blank" href="https://solscan.io/account/'+esc(r.owner)+'">'+esc(short(r.owner))+'</a></td><td>'+Math.round(r.amount).toLocaleString()+'</td><td>'+r.percent.toFixed(2)+'</td></tr>').join('')+'</table></div><p><small>Token accounts may represent pools or custodians. Similar balances do not prove wallet connections.</small></p>');try{const owner=rows.find(r=>r.owner!=='Unknown')?.owner;if(owner){const r=await fetch('https://api.helius.xyz/v0/addresses/'+owner+'/transactions?api-key='+encodeURIComponent(k)+'&limit=50');if(!r.ok)throw Error('HTTP '+r.status);const tx=await r.json();card('Recent wallet transactions','<p>'+tx.length+' transactions returned for '+esc(short(owner))+'</p><div class="scroll"><table>'+tx.slice(0,20).map(t=>'<tr><td>'+new Date(t.timestamp*1000).toLocaleDateString()+'</td><td>'+esc(t.type||'Unknown')+'</td><td><a target="_blank" href="https://solscan.io/tx/'+encodeURIComponent(t.signature)+'">View</a></td></tr>').join('')+'</table></div>')}}catch(e){card('Transaction history','Unavailable: '+esc(e.message))}const blob=new Blob([JSON.stringify({mint,checkedAt:new Date().toISOString(),supply:supply.uiAmountString,accounts:rows},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);card('Export','<a download="solana-investigation.json" href="'+url+'">Download JSON report</a><p><small>API key is not included.</small></p>')}catch(e){res.innerHTML='';card('Connection error',esc(e.message)+'. Helius browser CORS or account limits may block requests.')}finally{el('go').disabled=false}};
</script></main></html>
